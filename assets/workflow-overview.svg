<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How new jobs reach your sheet</title>
  <desc id="flow-desc">Workflow diagram: a daily schedule starts MEKA, reads saved job IDs from the Jobs sheet, skips duplicates, and appends only unseen jobs while keeping existing rows unchanged.</desc>
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="card-shadow" x="-12%" y="-20%" width="124%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#061b37" flood-opacity="0.055"/>
    </filter>
    <marker id="flow-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#7896b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="410" rx="28" fill="url(#flow-bg)"/>
  <rect x="1" y="1" width="1198" height="408" rx="27" fill="none" stroke="#dfe8f4" stroke-width="2"/>

  <g aria-hidden="true">
    <rect x="50" y="34" width="36" height="36" rx="9" fill="#075cf5"/>
    <rect x="57" y="41" width="9" height="9" rx="2" fill="#ffffff"/>
    <rect x="70" y="41" width="9" height="9" rx="2" fill="#ffffff" opacity="0.68"/>
    <rect x="57" y="54" width="9" height="9" rx="2" fill="#ffffff" opacity="0.68"/>
    <rect x="70" y="54" width="9" height="9" rx="2" fill="#ffffff"/>
    <text x="96" y="52" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">MEKA</text>
    <text x="96" y="67" fill="#71859b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="0.5">Jobs to Sheets</text>
  </g>

  <rect x="990" y="36" width="160" height="32" rx="16" fill="#ffffff" stroke="#dbe7f5"/>
  <circle cx="1006" cy="52" r="3.5" fill="#075cf5"/>
  <text x="1017" y="56.5" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.35">Workflow overview</text>

  <text x="50" y="106" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.35">How new jobs reach your sheet</text>
  <text x="50" y="127" fill="#60768e" font-family="Arial, Helvetica, sans-serif" font-size="13">A simple, repeatable path from discovery to a clean Jobs sheet.</text>

  <path d="M248 239H268" fill="none" stroke="#7896b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#flow-arrowhead)" aria-hidden="true"/>
  <path d="M476 239H496" fill="none" stroke="#7896b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#flow-arrowhead)" aria-hidden="true"/>
  <path d="M704 239H724" fill="none" stroke="#7896b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#flow-arrowhead)" aria-hidden="true"/>
  <path d="M932 239H952" fill="none" stroke="#7896b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#flow-arrowhead)" aria-hidden="true"/>

  <g filter="url(#card-shadow)">
    <rect x="50" y="143" width="188" height="191" rx="20" fill="#ffffff" stroke="#dbe7f5"/>
    <rect x="278" y="143" width="188" height="191" rx="20" fill="#075cf5"/>
    <rect x="506" y="143" width="188" height="191" rx="20" fill="#ffffff" stroke="#dbe7f5"/>
    <rect x="734" y="143" width="188" height="191" rx="20" fill="#ffffff" stroke="#dbe7f5"/>
    <rect x="962" y="143" width="188" height="191" rx="20" fill="#ffffff" stroke="#dbe7f5"/>
  </g>

  <g>
    <rect x="68" y="160" width="32" height="32" rx="9" fill="#edf5ff"/>
    <circle cx="84" cy="176" r="8.5" fill="none" stroke="#075cf5" stroke-width="2"/>
    <path d="M84 170.5V176L88 178.5" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="179" text-anchor="end" fill="#8a9aab" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">01</text>
    <text x="68" y="233" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Schedule</text>
    <text x="68" y="258" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Every day at</text>
    <text x="68" y="278" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">08:00 UTC</text>
  </g>

  <g>
    <rect x="296" y="160" width="32" height="32" rx="9" fill="#ffffff" opacity="0.14"/>
    <g transform="translate(-1.5 0)">
      <rect x="306" y="167" width="6" height="6" rx="1.5" fill="#ffffff"/>
      <rect x="315" y="167" width="6" height="6" rx="1.5" fill="#ffffff" opacity="0.68"/>
      <rect x="306" y="176" width="6" height="6" rx="1.5" fill="#ffffff" opacity="0.68"/>
      <rect x="315" y="176" width="6" height="6" rx="1.5" fill="#ffffff"/>
    </g>
    <text x="448" y="179" text-anchor="end" fill="#ffffff" opacity="0.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">02</text>
    <text x="296" y="233" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Run MEKA</text>
    <text x="296" y="258" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Search with MEKA</text>
    <text x="296" y="278" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Get recent jobs</text>
  </g>

  <g>
    <rect x="524" y="160" width="32" height="32" rx="9" fill="#edf5ff"/>
    <g transform="translate(-1.5 0)">
      <path d="M534 167H544L549 172V185H534Z" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M544 167V172H549M538 175H545M538 179H545M541.5 175V181" fill="none" stroke="#075cf5" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="676" y="179" text-anchor="end" fill="#8a9aab" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">03</text>
    <text x="524" y="233" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Read sheet</text>
    <text x="524" y="258" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Check your sheet</text>
    <text x="524" y="278" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Read saved job IDs</text>
  </g>

  <g>
    <rect x="752" y="160" width="32" height="32" rx="9" fill="#edf5ff"/>
    <g transform="translate(-3 0)">
      <path d="M760 168H767L772 176M760 184H767L772 176" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="771" y="172" width="11" height="8" rx="4" fill="#075cf5"/>
    </g>
    <text x="904" y="179" text-anchor="end" fill="#8a9aab" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">04</text>
    <text x="752" y="233" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Skip duplicates</text>
    <text x="752" y="258" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Compare job IDs</text>
    <text x="752" y="278" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Keep first-seen time</text>
  </g>

  <g>
    <rect x="980" y="160" width="32" height="32" rx="9" fill="#edf5ff"/>
    <g transform="translate(-1.25 0)">
      <path d="M988 167H997L1002 172V184H988Z" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M997 167V172H1002M992 175H997" fill="none" stroke="#075cf5" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="1001" cy="182" r="5.5" fill="#075cf5"/>
      <path d="M1001 179.5V184.5M998.5 182H1003.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="1132" y="179" text-anchor="end" fill="#8a9aab" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">05</text>
    <text x="980" y="233" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Add new rows</text>
    <text x="980" y="258" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Append unseen jobs</text>
    <text x="980" y="278" fill="#536b84" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Keep existing rows</text>
  </g>

  <path d="M50 351H1150" stroke="#e3ebf5" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"/>
  <circle cx="58" cy="373" r="8" fill="#edf5ff"/>
  <path d="M54.5 373L57 375.5L62 369.5" fill="none" stroke="#075cf5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="377" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="13">Only new jobs. Existing rows stay unchanged.</text>
  <text x="1150" y="377" text-anchor="end" fill="#7890a7" font-family="Arial, Helvetica, sans-serif" font-size="11.5">One workflow · One sheet</text>
</svg>
