<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="setup-title setup-desc">
  <title id="setup-title">n8n workflow setup map</title>
  <desc id="setup-desc">Four setup stages: import the workflow, connect Apify and Google credentials, prepare the Jobs sheet, then run a manual test and activate a schedule. This is an illustration, not a product screenshot.</desc>
  <defs>
    <linearGradient id="setup-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f9ff"/>
    </linearGradient>
    <filter id="setup-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#061b37" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="30" fill="url(#setup-bg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="29" fill="none" stroke="#dfe9f6" stroke-width="2"/>
  <circle cx="85" cy="445" r="125" fill="#075cf5" opacity="0.03"/>
  <circle cx="1160" cy="40" r="110" fill="#075cf5" opacity="0.035"/>

  <g aria-hidden="true">
    <rect x="58" y="43" width="36" height="36" rx="9" fill="#075cf5"/>
    <rect x="65" y="50" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="78" y="50" width="9" height="9" rx="2" fill="#ffffff" opacity="0.70"/>
    <rect x="65" y="63" width="9" height="9" rx="2" fill="#ffffff" opacity="0.70"/>
    <rect x="78" y="63" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
    <text x="108" y="59" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">MEKA  /  SETUP</text>
  </g>
  <text x="58" y="119" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.6">From import to first scheduled run</text>
  <text x="58" y="145" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="13">Bring your own accounts. Keep the workflow inactive until the full test succeeds.</text>
  <rect x="908" y="44" width="234" height="36" rx="18" fill="#ffffff" stroke="#dfe9f6"/>
  <circle cx="927" cy="62" r="4" fill="#075cf5"/>
  <text x="941" y="67" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="0.9">ILLUSTRATION / NOT UI</text>

  <path d="M293 250H318M558 250H583M823 250H848" stroke="#9ab1c9" stroke-width="3" stroke-linecap="round" aria-hidden="true"/>
  <path d="M314 244L321 250L314 256M579 244L586 250L579 256M844 244L851 250L844 256" fill="none" stroke="#9ab1c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>

  <g filter="url(#setup-shadow)">
    <rect x="58" y="184" width="235" height="222" rx="22" fill="#ffffff" stroke="#dfe9f6"/>
    <rect x="323" y="184" width="235" height="222" rx="22" fill="#ffffff" stroke="#dfe9f6"/>
    <rect x="588" y="184" width="235" height="222" rx="22" fill="#ffffff" stroke="#dfe9f6"/>
    <rect x="853" y="184" width="289" height="222" rx="22" fill="#ffffff" stroke="#dfe9f6"/>
  </g>

  <g>
    <circle cx="89" cy="214" r="17" fill="#075cf5"/>
    <text x="89" y="219" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">1</text>
    <rect x="116" y="202" width="24" height="24" rx="7" fill="#075cf5" opacity="0.10"/>
    <path d="M122 218V211L128 207L134 211V218M125 218V214H131V218" fill="none" stroke="#075cf5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="79" y="261" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Import</text>
    <text x="79" y="286" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Import from the raw URL</text>
    <text x="79" y="306" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">or choose Import from File.</text>
    <rect x="79" y="331" width="124" height="42" rx="12" fill="#f5f9ff"/>
    <text x="94" y="347" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">KEEP INACTIVE</text>
    <text x="94" y="362" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="10">No automatic paid runs</text>
  </g>

  <g>
    <circle cx="354" cy="214" r="17" fill="#075cf5"/>
    <text x="354" y="219" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">2</text>
    <rect x="381" y="202" width="24" height="24" rx="7" fill="#075cf5" opacity="0.10"/>
    <path d="M386 214H390V218H386ZM397 214H401V218H397Z" fill="none" stroke="#075cf5" stroke-width="1.6"/>
    <path d="M390 216H393C393 210 397 210 397 216" fill="none" stroke="#075cf5" stroke-width="1.6" stroke-linecap="round"/>
    <text x="344" y="261" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Connect</text>
    <text x="344" y="286" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Apify header: 4 nodes</text>
    <text x="344" y="306" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Google OAuth: 2 nodes</text>
    <rect x="344" y="331" width="132" height="42" rx="12" fill="#f5f9ff"/>
    <text x="359" y="347" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">YOUR CREDENTIALS</text>
    <text x="359" y="362" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="10">Cloud Google sign-in recommended</text>
  </g>

  <g>
    <circle cx="619" cy="214" r="17" fill="#075cf5"/>
    <text x="619" y="219" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">3</text>
    <rect x="646" y="202" width="24" height="24" rx="7" fill="#0f9d58" opacity="0.10"/>
    <path d="M658 202V226M652 208H664M652 214H664M652 220H664" stroke="#0f9d58" stroke-width="1.7" stroke-linecap="round"/>
    <text x="609" y="261" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Prepare</text>
    <text x="609" y="286" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Create a tab named Jobs.</text>
    <text x="609" y="306" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Paste TSV header into A1.</text>
    <rect x="609" y="331" width="142" height="42" rx="12" fill="#f5f9ff"/>
    <text x="624" y="347" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">TEN COLUMNS / A:J</text>
    <text x="624" y="362" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="10">Add your sheetId + search</text>
  </g>

  <g>
    <circle cx="884" cy="214" r="17" fill="#075cf5"/>
    <text x="884" y="219" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">4</text>
    <rect x="911" y="202" width="24" height="24" rx="7" fill="#075cf5" opacity="0.10"/>
    <path d="M917 219L922 224L930 211" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="874" y="261" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Test, then schedule</text>
    <text x="874" y="286" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Run manually. Inspect n8n and the sheet.</text>
    <text x="874" y="306" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12">Activate only after the full test succeeds.</text>
    <rect x="874" y="331" width="150" height="42" rx="12" fill="#075cf5"/>
    <text x="889" y="347" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">DEFAULT: DAILY 08:00 UTC</text>
    <text x="889" y="362" fill="#ffffff" opacity="0.78" font-family="Arial, Helvetica, sans-serif" font-size="10">Run one writer per Jobs sheet</text>
  </g>

  <text x="58" y="432" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="11">Configuration required after import. Import support is not an end-to-end credential or Google Sheets test.</text>
  <text x="1142" y="432" text-anchor="end" fill="#075cf5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">SETUP GUIDE / 01-04</text>
</svg>
