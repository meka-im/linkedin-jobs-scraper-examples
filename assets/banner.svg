<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">MEKA LinkedIn Jobs to Google Sheets banner</title>
  <desc id="banner-desc">A daily job flow runs from Schedule through MEKA to Google Sheets, with only new jobs appended to the sheet.</desc>
  <defs>
    <linearGradient id="page-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f9ff"/>
    </linearGradient>
    <linearGradient id="me-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075cf5"/>
      <stop offset="1" stop-color="#0647c8"/>
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#075cf5" opacity="0.10"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061b37" flood-opacity="0.07"/>
    </filter>
    <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#8ca8c5"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="34" fill="url(#page-fill)"/>
  <rect x="1" y="1" width="1198" height="338" rx="33" fill="none" stroke="#dfe9f6" stroke-width="2"/>
  <path d="M0 268C174 208 278 326 450 284C612 244 694 306 848 263C1004 219 1086 245 1200 204V340H0Z" fill="url(#dot-grid)" aria-hidden="true"/>
  <circle cx="1124" cy="42" r="88" fill="#075cf5" opacity="0.035" aria-hidden="true"/>
  <circle cx="535" cy="25" r="4" fill="#075cf5" opacity="0.26" aria-hidden="true"/>
  <circle cx="566" cy="25" r="4" fill="#075cf5" opacity="0.13" aria-hidden="true"/>
  <circle cx="597" cy="25" r="4" fill="#075cf5" opacity="0.08" aria-hidden="true"/>

  <g aria-hidden="true">
    <rect x="68" y="60" width="58" height="58" rx="14" fill="#075cf5"/>
    <rect x="79" y="71" width="16" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="99" y="71" width="16" height="16" rx="3" fill="#ffffff" opacity="0.70"/>
    <rect x="79" y="91" width="16" height="16" rx="3" fill="#ffffff" opacity="0.70"/>
    <rect x="99" y="91" width="16" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="146" y="100" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="3">MEKA</text>
  </g>

  <text x="68" y="151" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">PUBLIC JOB DATA  /  N8N  /  GOOGLE SHEETS</text>
  <text x="68" y="210" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" letter-spacing="-1.8">New jobs.</text>
  <text x="68" y="264" fill="#075cf5" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" letter-spacing="-1.8">One clean sheet.</text>
  <text x="70" y="301" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="16">Recent public roles, deduplicated before they reach your spreadsheet.</text>

  <g filter="url(#card-shadow)">
    <rect x="732" y="60" width="398" height="226" rx="25" fill="#ffffff"/>
    <rect x="732.5" y="60.5" width="397" height="225" rx="24.5" fill="none" stroke="#dfe9f6"/>
  </g>
  <circle cx="758" cy="83" r="3" fill="#075cf5"/>
  <text x="768" y="87" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">DAILY JOB MONITOR</text>

  <g aria-hidden="true">
    <rect x="752" y="108" width="100" height="128" rx="16" fill="#f7faff" stroke="#dfe9f6"/>
    <circle cx="802" cy="139" r="11" fill="none" stroke="#075cf5" stroke-width="2"/>
    <path d="M802 132V140L808 144" fill="none" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="802" y="181" text-anchor="middle" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Schedule</text>
    <text x="802" y="205" text-anchor="middle" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Every day</text>

    <path d="M858 172H874.5" fill="none" stroke="#8ca8c5" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-arrow)"/>

    <rect x="881" y="108" width="100" height="128" rx="16" fill="url(#me-card)"/>
    <rect x="917" y="125" width="12" height="12" rx="3" fill="#ffffff" opacity="0.98"/>
    <rect x="933" y="125" width="12" height="12" rx="3" fill="#ffffff" opacity="0.70"/>
    <rect x="917" y="141" width="12" height="12" rx="3" fill="#ffffff" opacity="0.70"/>
    <rect x="933" y="141" width="12" height="12" rx="3" fill="#ffffff" opacity="0.98"/>
    <text x="931" y="181" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">MEKA</text>
    <text x="931" y="205" text-anchor="middle" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Fetch jobs</text>

    <path d="M987 172H1003.5" fill="none" stroke="#8ca8c5" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-arrow)"/>

    <rect x="1010" y="108" width="100" height="128" rx="16" fill="#f7faff" stroke="#dfe9f6"/>
    <path d="M1049 125H1066L1071 130V153H1049Z" fill="#ffffff" stroke="#075cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1066 125V130H1071M1053 138H1067M1053 143H1067M1053 148H1067M1057 138V148M1062 138V148" fill="none" stroke="#075cf5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1060" y="181" text-anchor="middle" fill="#061b37" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Sheets</text>
    <text x="1060" y="205" text-anchor="middle" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="11.5">New rows</text>
  </g>

  <rect x="752" y="249" width="358" height="1" fill="#dfe9f6"/>
  <circle cx="760" cy="267" r="8" fill="#eaf3ff"/>
  <path d="M756.5 267L759 269.5L764 264.5" fill="none" stroke="#075cf5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="776" y="270" fill="#45627f" font-family="Arial, Helvetica, sans-serif" font-size="12.5">Only new jobs reach your sheet</text>
</svg>
